services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5433:5432"
  database-migration:
    build: 
      context: ./shared/database
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./shared/database/migrations:/app/migrations
    depends_on:
      - database

volumes:
  postgres_data: