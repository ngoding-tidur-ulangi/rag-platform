services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
  database-migration:
    build: 
      context: ./shared/database
    environment:
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - ./shared/database/migrations:/app/migrations
    depends_on:
      - database

  chat-service:
    build:
      context: .
      dockerfile: services/chat-service/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    ports:
      - "8000:8000"
    volumes:
      - ./services/chat-service:/app/services/chat-service
      - ./shared/database:/app/shared/database
      - ./shared/common:/app/shared/common
    depends_on:
      - database
      - redis

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
